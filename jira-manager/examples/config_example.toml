# Jira Manager Configuration Example
# Location: ~/.config/jira/config.toml

# Directory mappings - associates project directories with Jira profiles
[directory_mappings]
"/Users/name/projects/web-app" = "company_main"
"/Users/name/projects/mobile-app" = "company_main"
"/Users/name/projects/client-project" = "client_acme"
"/Users/name/personal/side-project" = "personal_jira"

# Jira profiles - different configurations for different servers/projects
[profiles.company_main]
server_url = "https://jira.company.com"
pat = "MzYxNjc5ODE2NTEyOmFGZkVXZzN5..."  # Personal Access Token
project_key = "WEBAPP"

[profiles.client_acme]
server_url = "https://acme.atlassian.net"
pat = "NzEyNDU2Nzg5MDEyOmJHZ1JYZDR6..."
project_key = "ACME"

[profiles.personal_jira]
server_url = "https://jira.mysite.com"
pat = "OTEyMzQ1Njc4OTAxOmNIaFNZZTV2..."
project_key = "SIDE"
