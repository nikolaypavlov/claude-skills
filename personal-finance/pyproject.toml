[project]
name = "pf-skill"
version = "0.5.0"
description = "Personal finance umbrella skill - query / report / categorize / budget over the shared ~/finances/data.db"
authors = [
    { name = "Mykola Pavlov", email = "me@nikolaypavlov.com" },
]
requires-python = ">=3.13"
# PR#3 read path was stdlib only. PR#4 adds pyyaml for loading
# description.yaml / *.local.yaml rule files. tzdata stays optional
# (only matters when a future narrative path converts unix seconds back
# to Europe/Kyiv for display).
dependencies = [
    "pyyaml>=6",
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["personal-finance", "monobank", "privat24", "sqlite", "categorize"]

[project.urls]
Homepage = "https://github.com/nikolaypavlov/claude-skills"
Repository = "https://github.com/nikolaypavlov/claude-skills.git"

[project.scripts]
pf-query = "pf_skill.query:main"
pf-report = "pf_skill.report:main"
pf-categorize = "pf_skill.categorize:main"
pf-rules = "pf_skill.rules_cli:main"
pf-budget = "pf_skill.budget_cli:main"

[project.optional-dependencies]
sheets = [
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Migration SQL and the bundled seed rules travel with the package so
# importlib.resources can find them in both source-tree and
# installed-wheel layouts.
[tool.setuptools.package-data]
"pf_skill.schema" = ["*.sql"]
"pf_skill.rules" = ["*.json", "*.yaml"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
