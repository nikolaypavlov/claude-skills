[package]
name = "icloud-mcp"
version = "0.3.4"
edition = "2021"
description = "Local MCP server for Apple iCloud Calendar (CalDAV) and Mail (IMAP)"
license = "MIT"
authors = ["Mykola Pavlov <me@nikolaypavlov.com>"]

[[bin]]
name = "icloud-mcp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[dependencies]
# MCP SDK
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "net",
    "time",
    "sync",
] }

# Common
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# CalDAV via libdav (hyper-based)
libdav = "0.10"
http = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-native-certs", "native-tokio"] }
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["auth"] }
quick-xml = "0.37"
icalendar = "0.17"

# IMAP
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
mail-parser = "0.11"

# Draft email construction (RFC 822 builder only, no transport - drafts are APPENDed
# to the Drafts IMAP folder rather than sent via SMTP).
lettre = { version = "0.11", default-features = false, features = ["builder"] }

# HTML -> Markdown
html2md = "0.2"

# Logging (stderr; stdout reserved for MCP)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "test-util",
] }

[profile.release]
lto = "thin"
strip = "symbols"
