[project]
name = "privat24-import"
version = "0.3.0"
description = "Privat24 statement (XLSX) import skill - writes privat_* tables in ~/finances/data.db"
authors = [
    { name = "Mykola Pavlov", email = "me@nikolaypavlov.com" },
]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    # zoneinfo (stdlib in 3.9+) consults the IANA tz database. On Linux
    # and macOS that's /usr/share/zoneinfo; on Windows and slim
    # container images it's missing. Vendoring tzdata via PyPI gives us
    # a deterministic fallback so `ZoneInfo("Europe/Kyiv")` never raises
    # at module import.
    "tzdata>=2024.1",
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["privat24", "monobank", "personal-finance", "csv", "xlsx", "import"]

[project.urls]
Homepage = "https://github.com/nikolaypavlov/claude-skills"
Repository = "https://github.com/nikolaypavlov/claude-skills.git"

[project.scripts]
privat24-import = "privat24_import.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Migration SQL files travel with the package so importlib.resources can
# find them in both source-tree and installed-wheel layouts.
[tool.setuptools.package-data]
"privat24_import.schema" = ["*.sql"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
