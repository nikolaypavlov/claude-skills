# pre-commit hooks. Install once per clone via `pre-commit install`.
#
# Gitleaks runs on every `git commit` and is a HARD FAIL (per design doc
# §9.6) - the threat model for the personal-finance loop assumes that
# the repo is public and that a single leaked API token, IBAN, or PAN
# masked-but-still-revealing string is unacceptable. Pin the rev to a
# specific tag rather than a moving branch so the contract is
# reproducible.
#
# The python-dev plugin's own pre-commit hook (hooks/pre-commit.sh,
# registered as a PreToolUse hook against the Bash tool, ruff + ty +
# yamllint on staged files) runs in a separate path - that hook is
# Claude-Code-only. This file covers the standard `pre-commit` framework
# path that contributors use locally and CI uses on GitHub.
---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged diff for committed secrets and PII
