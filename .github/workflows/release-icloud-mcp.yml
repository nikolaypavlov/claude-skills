name: Release icloud-mcp

on:
  push:
    tags:
      - "icloud-mcp-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      # Build on macos-26 SDK but support older OS versions at runtime.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      # All third-party actions are pinned to commit SHAs (not tags) per
      # GitHub's supply-chain hardening guidance. Tag refs are mutable and
      # can be force-pushed by a compromised maintainer; commit SHAs cannot.
      # When bumping, refresh the trailing `# vX` comment so reviewers can
      # see the human-readable version at a glance.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable tracks the `stable` *branch* - pinning
        # to a commit is doubly important since branches move on every push.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable as of 2026-03-27
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.8.1
        with:
          workspaces: icloud-mcp -> target
          key: ${{ matrix.target }}

      - name: Build release binary
        working-directory: icloud-mcp
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Read crate version
        id: ver
        working-directory: icloud-mcp
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Cargo.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
          CRATE_VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          expected="icloud-mcp-v${CRATE_VERSION}"
          if [ "$expected" != "$REF_NAME" ]; then
            echo "tag '$REF_NAME' does not match Cargo.toml version (expected '$expected')" >&2
            exit 1
          fi

      - name: Package tarball + checksum
        working-directory: icloud-mcp
        env:
          CRATE_VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          name="icloud-mcp-v${CRATE_VERSION}-${TARGET}"
          mkdir -p dist
          cp "target/${TARGET}/release/icloud-mcp" "dist/icloud-mcp"
          tar -C dist -czf "dist/${name}.tar.gz" icloud-mcp
          rm "dist/icloud-mcp"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: icloud-mcp-${{ matrix.target }}
          path: icloud-mcp/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Combine per-target checksums into SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          cat *.tar.gz.sha256 > SHA256SUMS
          rm *.tar.gz.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
